name: Update Lua test dependencies

on:
  schedule:
    - cron: "30 18 * * 0" # Monday 03:30 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lua-rocks-updater
  cancel-in-progress: false

jobs:
  update:
    name: Refresh verified Lua rocks and propose update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install current mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          minimum_release_age: "0s" # Validate the latest stable mise; tools remain locked.
          install: false
          cache: false
          experimental: true

      - name: Record mise version
        run: mise --version

      - name: Prepare the single automation branch
        shell: bash
        run: |
          branch="automation/lua-rocks"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              merge origin/main --no-edit
          else
            git switch -c "$branch"
          fi

      - name: Install locked Lua lock-generation tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked node conda:gcc conda:lua conda:luarocks

      - name: Refresh compatible Lua rocks
        run: mise run --skip-tools update:lua

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MOONBIT_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.MOONBIT_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vfox-moonbit
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve updater identity
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "GitHub App returned an invalid slug" >&2
            exit 1
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "GitHub App bot user ID is invalid" >&2
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Enforce update allowlist and open one pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          while IFS= read -r path; do
            case "$path" in
              lua-rocks.lock) ;;
              *) echo "Lua updater changed forbidden path: $path" >&2; exit 1 ;;
            esac
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          git add -- lua-rocks.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified Lua test dependencies"
          fi
          branch="automation/lua-rocks"
          if git diff --quiet origin/main HEAD; then
            exit 0
          fi
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            body="$RUNNER_TEMP/tooling-pr-body.md"
            cat > "$body" <<'BODY'
          Updates compatible Lua test rocks. Versions, upstream rockspec SHA-256 values, and extracted source-tree SHA-256 values remain locked and verified.

          CI and dependency review validate this update before merge. This PR is never auto-merged, so the normal maintenance workload is one review of this weekly PR.
          BODY
            gh pr create --head "$branch" --base main \
              --title "chore: update Lua test dependencies" --body-file "$body"
          fi
