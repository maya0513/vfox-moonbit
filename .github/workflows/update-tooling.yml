name: Update maintenance tools

on:
  schedule:
    - cron: "30 18 * * 0" # Monday 03:30 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-tooling-updater
  cancel-in-progress: false

jobs:
  update:
    name: Refresh maintenance locks and propose update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses] -- Follow compatible major releases.
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install current mise
        uses: jdx/mise-action@v5 # zizmor: ignore[unpinned-uses] -- Follow compatible major releases.
        with:
          install: false
          cache: false
          experimental: true

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3 # zizmor: ignore[unpinned-uses] -- Follow compatible major releases.
        with:
          client-id: ${{ vars.MOONBIT_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.MOONBIT_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vfox-moonbit
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve updater identity and branch
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "GitHub App returned an invalid slug" >&2
            exit 1
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "GitHub App bot user ID is invalid" >&2
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          branch="automation/maintenance-tooling"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
            git merge origin/main --no-edit
          else
            git switch -c "$branch"
          fi

      - name: Refresh compatible versions and locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run update:tooling

      - name: Enforce update allowlist and open one pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          while IFS= read -r path; do
            case "$path" in
              mise.lock|package.json|pnpm-lock.yaml|pnpm-workspace.yaml) ;;
              *) echo "Tooling updater changed forbidden path: $path" >&2; exit 1 ;;
            esac
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          git add mise.lock package.json pnpm-lock.yaml pnpm-workspace.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update maintenance tools within compatible ranges"
          fi
          branch="automation/maintenance-tooling"
          if git diff --quiet origin/main HEAD; then
            exit 0
          fi
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            body="$RUNNER_TEMP/tooling-pr-body.md"
            cat > "$body" <<'BODY'
          Updates mise tools and npm dependencies together. The configured compatibility ranges are preserved, and Vite/Vitest/coverage versions are synchronized with Vite+. GitHub Actions follow their configured major tags.

          CI validates this update before merge. This PR is never auto-merged.
          BODY
            gh pr create --head "$branch" --base main \
              --title "chore: update maintenance tools" --body-file "$body"
          fi
