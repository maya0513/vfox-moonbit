name: Update dependency artifacts

on:
  push:
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare dependency artifacts
    if: github.event_name == 'push' && github.event.sender.id == 29139614 && startsWith(github.ref, 'refs/heads/renovate/')
    concurrency:
      group: dependency-artifacts-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_SAFE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install validated mise for dependency preparation
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          # mise 2026.11.0 safe mode rejects the recorded Conda graph (jdx/mise#15235).
          version: "2026.10.25"
          minimum_release_age: "0s"
          install: false
          cache: false
          experimental: true

      - name: Record mise version
        run: mise --version

      - name: Prepare mise locks and Node toolchain
        id: mise
        uses: maya0513/renovate-config/.github/actions/mise-pnpm@c23fac84b4008c769ab5b8547bdd0f582038af7a # main
        with:
          verify-only: "false"
          lock-groups: >-
            [{"lockfile":"mise.lock","tools":["conda:gcc","conda:lua","conda:luarocks"],"platforms":["linux-x64","linux-arm64"],"verify":"locked"},
             {"lockfile":"mise.lock","tools":["actionlint","node","pnpm","shellcheck","stylua","vfox","zizmor"],"platforms":["linux-x64","linux-arm64","macos-arm64","windows-x64"],"verify":"regenerate"}]

      - name: Synchronize the selected Vite+ dependency graph
        id: viteplus
        uses: maya0513/renovate-config/.github/actions/pnpm-viteplus@c23fac84b4008c769ab5b8547bdd0f582038af7a # main
        with:
          preparation-state: ${{ steps.mise.outputs.state }}

      - name: Validate dependency outputs
        id: outputs
        uses: maya0513/renovate-config/.github/actions/pnpm-outputs@c23fac84b4008c769ab5b8547bdd0f582038af7a # main
        with:
          mise-state: ${{ steps.mise.outputs.state }}
          viteplus-state: ${{ steps.viteplus.outputs.state }}

    outputs:
      base: ${{ steps.outputs.outputs.base }}
      changed: ${{ steps.outputs.outputs.changed }}
      artifact-id: ${{ steps.outputs.outputs.artifact-id }}

  publish:
    needs: prepare
    uses: maya0513/renovate-config/.github/workflows/publish-pnpm-artifacts.yml@c23fac84b4008c769ab5b8547bdd0f582038af7a # main
    with:
      base: ${{ needs.prepare.outputs.base }}
      changed: ${{ needs.prepare.outputs.changed }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      mise: true
      viteplus: true
      app-client-id: ${{ vars.MOONBIT_UPDATER_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.MOONBIT_UPDATER_PRIVATE_KEY }}
