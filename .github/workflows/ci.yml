name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect immutable exact release manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull request base SHA is invalid" >&2
            exit 1
          fi
          while IFS= read -r path; do
            [[ "$path" == "releases/latest.json" ]] && continue
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              echo "Existing exact manifest is immutable: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only "$BASE_SHA" -- releases)

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          install: false
          cache: true
          experimental: true

      - name: Install locked development tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked

      - name: Bootstrap locked test dependencies
        run: mise run bootstrap

      - name: Run deterministic CI suite
        run: mise run ci

  mise_lock:
    name: mise-lock (mise 2026.9.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise under test
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          install: false
          cache: false
          experimental: true

      - name: Validate the compatibility lockfile
        run: mise install --locked --dry-run

  mise_e2e:
    name: mise-e2e (${{ matrix.os }}, mise 2026.9.2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise under test
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          install: false
          cache: false
          experimental: true

      - name: Install pinned E2E Python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install python@3.13.15

      - name: Run real-download E2E through mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec python@3.13.15 -- python scripts/e2e.py --backend mise

  vfox_e2e:
    name: vfox-e2e (${{ matrix.os }}, vfox 1.0.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise bootstrapper
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          install: false
          cache: false

      - name: Install pinned E2E tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: mise install python@3.13.15 vfox@1.0.12

      - name: Run real-download E2E through standalone vfox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          mise exec python@3.13.15 vfox@1.0.12 --
          python scripts/e2e.py --backend vfox --allow-vfox-user-state

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, mise_lock, mise_e2e, vfox_e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI group to pass
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LOCK_RESULT: ${{ needs.mise_lock.result }}
          MISE_RESULT: ${{ needs.mise_e2e.result }}
          VFOX_RESULT: ${{ needs.vfox_e2e.result }}
        run: |
          for result in "$QUALITY_RESULT" "$LOCK_RESULT" "$MISE_RESULT" "$VFOX_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI group finished with: $result" >&2
              exit 1
            fi
          done
