name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect immutable exact release manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull request base SHA is invalid" >&2
            exit 1
          fi
          while IFS= read -r path; do
            [[ "$path" == "releases/latest.json" ]] && continue
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              echo "Existing exact manifest is immutable: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only "$BASE_SHA" -- releases)

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
          cache: true
          experimental: true

      - name: Bootstrap locked test dependencies
        run: mise run bootstrap

      - name: Run deterministic CI suite
        run: mise run ci

  mise-e2e:
    name: mise-e2e (${{ matrix.os }}, mise ${{ matrix.mise-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        mise-version: [2026.5.12, 2026.9.1]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install mise under test
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ matrix.mise-version }}
          install: false
          cache: false
          experimental: true

      - name: Install pinned E2E Python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install python@3.13.15

      - name: Run real-download E2E through mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec python@3.13.15 -- python scripts/e2e.py --backend mise

  vfox-e2e:
    name: vfox-e2e (${{ matrix.os }}, vfox ${{ matrix.vfox-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        vfox-version: [0.4.0, 1.0.11]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install mise bootstrapper
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: false
          cache: false

      - name: Install pinned E2E tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VFOX_VERSION: ${{ matrix.vfox-version }}
        shell: bash
        run: mise install python@3.13.15 "vfox@$VFOX_VERSION"

      - name: Run real-download E2E through standalone vfox
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VFOX_VERSION: ${{ matrix.vfox-version }}
        shell: bash
        run: >-
          mise exec python@3.13.15 "vfox@$VFOX_VERSION" --
          python scripts/e2e.py --backend vfox --allow-vfox-user-state
