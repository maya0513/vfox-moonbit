name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect immutable exact release manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull request base SHA is invalid" >&2
            exit 1
          fi
          while IFS= read -r path; do
            [[ "$path" == "releases/latest.json" ]] && continue
            if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
              echo "Existing exact manifest is immutable: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only "$BASE_SHA" -- releases)

      - name: Reject vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

      - name: Install configured development tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          minimum_release_age: "0s" # Validate the latest stable mise; tools remain locked.
          install: false
          cache: false
          experimental: true

      - name: Record mise version
        run: mise --version

      - name: Install locked development tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap locked test dependencies
        run: mise run bootstrap

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Run deterministic CI suite
        run: pnpm vp run ci

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  mise_lock:
    name: mise-lock (mise latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise under test
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          minimum_release_age: "0s" # Validate the latest stable mise; tools remain locked.
          install: false
          cache: false
          experimental: true

      - name: Record mise version
        run: mise --version

      - name: Validate the compatibility lockfile
        run: mise install --locked --dry-run

  mise_e2e:
    name: mise-e2e (${{ matrix.os }}, mise latest)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise under test
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          minimum_release_age: "0s" # Validate the latest stable mise; tools remain locked.
          install: false
          cache: false
          experimental: true

      - name: Record mise version
        run: mise --version

      - name: Install configured E2E Node toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked node pnpm

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real-download E2E through mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm vp run e2e

  vfox_e2e:
    name: vfox-e2e (${{ matrix.os }}, vfox 1.x)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise bootstrapper
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          minimum_release_age: "0s" # Validate the latest stable mise; tools remain locked.
          install: false
          cache: false

      - name: Record mise version
        run: mise --version

      - name: Install configured E2E tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: mise install --locked node pnpm vfox

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked TypeScript dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run real-download E2E through standalone vfox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: pnpm vp run e2e:vfox

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, mise_lock, mise_e2e, vfox_e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI group to pass
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LOCK_RESULT: ${{ needs.mise_lock.result }}
          MISE_RESULT: ${{ needs.mise_e2e.result }}
          VFOX_RESULT: ${{ needs.vfox_e2e.result }}
        run: |
          for result in "$QUALITY_RESULT" "$LOCK_RESULT" "$MISE_RESULT" "$VFOX_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI group finished with: $result" >&2
              exit 1
            fi
          done
