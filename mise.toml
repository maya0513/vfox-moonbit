min_version = "2026.10.3"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
actionlint = "1.7.12"
"conda:gcc" = { version = "16.2.0", os = ["linux"] }
"conda:lua" = { version = "5.1.5", os = ["linux"] }
"conda:luarocks" = { version = "3.13.0", os = ["linux"] }
node = "24.21.0"
pnpm = "12.9.1"
shellcheck = "0.11.0"
stylua = "2.5.2"
vfox = "1.0.12"
zizmor = "1.30.1"

[tasks.bootstrap]
description = "Install locked Node and Lua test dependencies"
run = "bash scripts/bootstrap.sh"

[tasks."update:lua"]
description = "Update compatible Lua test rocks and their verified source hashes"
run = "bash scripts/lua-rocks.sh update"
