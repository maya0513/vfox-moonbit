min_version = "2026.9.2"

[settings]
experimental = true
lockfile = true

[tools]
actionlint = "1"
"conda:gcc" = { version = "16", os = ["linux"] }
"conda:lua" = { version = "5.1", os = ["linux"] }
"conda:luarocks" = { version = "3", os = ["linux"] }
node = "24"
pnpm = "12"
shellcheck = "0.11"
stylua = "2"
vfox = "1"
zizmor = "1"

[tasks.bootstrap]
description = "Install locked Node and Lua test dependencies"
run = "bash scripts/bootstrap.sh"

[tasks."update:tooling"]
description = "Update tool and dependency locks within the configured ranges"
run = "bash scripts/update-tooling.sh"
